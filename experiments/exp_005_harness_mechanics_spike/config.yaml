lora_configuration:
  enabled: false

questions:
  Q1: "Do tool calls made inside an AgentTool sub-agent count against the root max_tool_calls budget?"
  Q2: "Do run_skill_script / load_skill / load_skill_resource count against max_tool_calls? (They are not among the 9 @budget_gated tools.)"
  Q3: "Do ParallelAgent branches really reach vLLM at the same time? (vLLM log 'Running: N reqs')"
  Q4: "Does `git worktree add /tmp/wt_i` work in the sandbox, and does pytest in a worktree import the worktree code or /workspace (the editable install points to /workspace)?"
  Q5: "If a sub-agent / parallel branch calls submit_patch, does the whole session end immediately?"
  Q6: "Does an agent with include_contents: none still get {problem_description} / {hints} through instruction templating? Does `{key?}` (optional state) work?"
  Q7: "Can a LoopAgent exit early (exit_loop / escalate) with the closed ToolRegistry, or does it always run max_iterations?"
  Q8: "If the root is a SequentialAgent that ends without submit_patch, does the harness nudge and rerun the WHOLE pipeline?"

agent_architecture:
  mode: "multi_agent"
  variants:
    - "V1: root + AgentTool(sub-agent with run_command) -> Q1, Q5, Q6"
    - "V2: root with one skill containing a hello.py script -> Q2"
    - "V3: SequentialAgent[ParallelAgent[3 branches], judge] -> Q3, Q4, Q8"
    - "V4: LoopAgent[worker, checker] max_iterations 3 -> Q7"

eval_config:
  timeout_seconds: 120
  max_tool_calls: 30
  max_time_minutes: 15
  max_turns: 60

